name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Try to enable GitHub Pages (needs no action if already enabled)
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - name: Prepare site (works with loose files or with a .zip in the repo root)
        run: |
          set -e
          if [ -f index.html ]; then
            SRC=.
          else
            Z=$(find . -maxdepth 1 -name '*.zip' | head -n1)
            [ -n "$Z" ] || { echo "No index.html and no .zip file in the repo root"; exit 1; }
            echo "Unzipping $Z"
            mkdir _src && unzip -q "$Z" -d _src
            if [ -f _src/index.html ]; then SRC=_src; else SRC=$(dirname "$(find _src -maxdepth 3 -name index.html | head -n1)"); fi
          fi
          test -f "$SRC/index.html" || { echo "index.html not found"; exit 1; }
          if [ -f "$SRC/sw.js" ]; then sed -i "s/const V='noor-[^']*'/const V='noor-${GITHUB_SHA::10}'/" "$SRC/sw.js"; fi
          mkdir _site
          tar -C "$SRC" --exclude='./.git' --exclude='./.github' --exclude='./tools' --exclude='./_src' --exclude='./_site' --exclude='*.md' --exclude='*.zip' -cf - . | tar -C _site -xf -
          touch _site/.nojekyll
          ls _site | head -30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
